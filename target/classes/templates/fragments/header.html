<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="site-header" th:fragment="header(active)">
  <div class="container">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="2" stroke="#5fc1d1" stroke-width="1.5"/>
        <line x1="14.3" y1="1" x2="14.3" y2="39" stroke="#5fc1d1" stroke-width="1.2"/>
        <line x1="27.6" y1="1" x2="27.6" y2="39" stroke="#5fc1d1" stroke-width="1.2"/>
        <line x1="1" y1="14.3" x2="39" y2="14.3" stroke="#5fc1d1" stroke-width="1.2"/>
        <line x1="1" y1="27.6" x2="39" y2="27.6" stroke="#5fc1d1" stroke-width="1.2"/>
        <rect x="14.3" y="14.3" width="13.3" height="13.3" fill="#e8a33d"/>
      </svg>
      <span class="brand-text">
        <strong>Eser Yapı</strong>
        <span>MMC &mdash; 2007-ci ildən</span>
      </span>
    </a>

    <nav class="main-nav">
      <ul>
        <li><a href="/" th:classappend="${active == 'home'} ? 'is-active'">Ana Səhifə</a></li>
        <li><a href="/about" th:classappend="${active == 'about'} ? 'is-active'">Haqqımızda</a></li>
        <li><a href="/services" th:classappend="${active == 'services'} ? 'is-active'">Xidmətlər</a></li>
        <li><a href="/projects" th:classappend="${active == 'projects'} ? 'is-active'">Layihələr</a></li>
        <li><a href="/partners" th:classappend="${active == 'partners'} ? 'is-active'">Tərəfdaşlar</a></li>
        <li><a href="/contact" th:classappend="${active == 'contact'} ? 'is-active'">Əlaqə</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="/contact" class="btn btn-primary nav-cta">Təklif Alın</a>
      <button type="button" class="nav-toggle" aria-label="Menyunu aç/bağla" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 3H17M1 9H17M1 15H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

</body>
</html>
