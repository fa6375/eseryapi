<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="admin-sidebar" th:fragment="sidebar(active)">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="32" height="32">
      <rect x="1" y="1" width="38" height="38" rx="2" stroke="#5fc1d1" stroke-width="1.5"/>
      <line x1="14.3" y1="1" x2="14.3" y2="39" stroke="#5fc1d1" stroke-width="1.2"/>
      <line x1="27.6" y1="1" x2="27.6" y2="39" stroke="#5fc1d1" stroke-width="1.2"/>
      <line x1="1" y1="14.3" x2="39" y2="14.3" stroke="#5fc1d1" stroke-width="1.2"/>
      <line x1="1" y1="27.6" x2="39" y2="27.6" stroke="#5fc1d1" stroke-width="1.2"/>
      <rect x="14.3" y="14.3" width="13.3" height="13.3" fill="#e8a33d"/>
    </svg>
    <span class="brand-text"><strong style="color:#f5f5f2;">Eser Yapı</strong><span>Admin Paneli</span></span>
  </div>

  <nav class="admin-nav">
    <a href="/admin/dashboard" th:classappend="${active == 'dashboard'} ? 'is-active'">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="2.5" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="11" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.4"/></svg>
      İdarə Paneli
    </a>
    <a href="/admin/projects" th:classappend="${active == 'projects'} ? 'is-active'">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 17V8.5L10 4l7 4.5V17" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><rect x="8" y="11" width="4" height="6" stroke="currentColor" stroke-width="1.4"/></svg>
      Layihələr
    </a>
    <a href="/admin/partners" th:classappend="${active == 'partners'} ? 'is-active'">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M4 17a6 6 0 0 1 12 0" stroke="currentColor" stroke-width="1.4"/></svg>
      Tərəfdaşlar
    </a>
    <a href="/admin/messages" th:classappend="${active == 'messages'} ? 'is-active'">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 5.5 10 11 17.5 5.5" stroke="currentColor" stroke-width="1.4"/></svg>
      Mesajlar
    </a>
    <div class="divider"></div>
    <a href="/" target="_blank">
      <svg viewBox="0 0 20 20" fill="none"><path d="M8 4H4v12h12v-4" stroke="currentColor" stroke-width="1.4"/><path d="M11 3h6v6M17 3 9 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Saytı Göstər
    </a>
    <form th:action="@{/admin/logout}" method="post" style="margin:0;">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
      <button type="submit" style="all:unset; width:100%;" class="admin-nav">
        <span style="display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:3px; font-size:14.5px; color:#8b9bab; cursor:pointer;">
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M7 17H4a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 4 3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13 14l4-4-4-4M8 10h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Çıxış
        </span>
      </button>
    </form>
  </nav>
</aside>

</body>
</html>
