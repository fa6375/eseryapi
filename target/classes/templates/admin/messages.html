<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar — Admin — Eser Yapı MMC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div th:replace="~{fragments/admin-sidebar :: sidebar(active='messages')}"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Mesajlar</h1>
        <p class="sub">Açıq əlaqə formunuz vasitəsilə göndərilən sorğular.</p>
      </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="panel" th:if="${messages != null and !messages.isEmpty()}">
      <table class="data-table">
        <thead>
          <tr><th>Status</th><th>Kimdən</th><th>Mesaj</th><th>Qəbul Tarixi</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="m : ${messages}">
            <td><span class="badge" th:classappend="${!m.read} ? 'unread'" th:text="${m.read} ? 'Oxunub' : 'Yeni'">Status</span></td>
            <td>
              <strong th:text="${m.name}">Ad</strong><br>
              <span style="color:var(--slate-soft); font-size:13px;" th:text="${m.email}">e-poçt</span>
              <span th:if="${m.phone}" style="color:var(--slate-soft); font-size:13px;"> &middot; <span th:text="${m.phone}">telefon</span></span>
            </td>
            <td style="max-width:380px; white-space:pre-line;" th:text="${m.message}">Mesaj</td>
            <td th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy, HH:mm')}">tarix</td>
            <td>
              <div class="row-actions">
                <form th:if="${!m.read}" th:action="@{'/admin/messages/' + ${m.id} + '/read'}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                  <button type="submit" class="btn btn-outline btn-sm">Oxunmuş Kimi İşarələ</button>
                </form>
                <form th:action="@{'/admin/messages/' + ${m.id} + '/delete'}" method="post" data-confirm="Bu mesajı silmək istəyirsiniz?">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                  <button type="submit" class="btn btn-danger btn-sm">Sil</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="panel admin-empty" th:unless="${messages != null and !messages.isEmpty()}">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 5.5 10 11 17.5 5.5" stroke="currentColor" stroke-width="1.4"/></svg>
      <p>Hələ mesaj yoxdur. Əlaqə formundan göndərilən sorğular burada görünəcək.</p>
    </div>
  </main>
</div>

</body>
</html>
