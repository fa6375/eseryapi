<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Əlaqə — Eser Yapı MMC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/header :: header(active='contact')}"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="/">Ana Səhifə</a> / Əlaqə</p>
      <p class="eyebrow">Danışaq</p>
      <h1 style="font-size:clamp(32px,4.4vw,48px);">Layihəniz haqqında bizə məlumat verin.</h1>
      <p class="lede">Bir neçə detal paylaşın, komandamız bir iş günü ərzində sizinlə əlaqə saxlayacaq.</p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-wrap">
      <div class="reveal">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/contact}" th:object="${contactMessage}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
          <div class="form-group">
            <label for="name">Ad Soyad</label>
            <input class="form-control" type="text" id="name" th:field="*{name}" required placeholder="Aysel Məmmədova">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:#b5473a; font-size:13px; margin-top:6px;"></div>
          </div>
          <div class="form-group">
            <label for="email">E-poçt</label>
            <input class="form-control" type="email" id="email" th:field="*{email}" required placeholder="siz@sirket.com">
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:#b5473a; font-size:13px; margin-top:6px;"></div>
          </div>
          <div class="form-group">
            <label for="phone">Telefon (istəyə bağlı)</label>
            <input class="form-control" type="tel" id="phone" th:field="*{phone}" placeholder="+994 50 123 45 67">
          </div>
          <div class="form-group">
            <label for="message">Layihə detalları</label>
            <textarea class="form-control" id="message" th:field="*{message}" required placeholder="Sahəniz, işin əhatəsi və müddəti haqqında bizə məlumat verin..."></textarea>
            <div th:if="${#fields.hasErrors('message')}" th:errors="*{message}" style="color:#b5473a; font-size:13px; margin-top:6px;"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Mesaj Göndər</button>
        </form>
      </div>

      <div class="reveal">
        <div class="contact-info-card">
          <div class="row">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 18s6-5.5 6-10a6 6 0 1 0-12 0c0 4.5 6 10 6 10Z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
            <div><span class="k">Baş Ofis</span>Nizami rayonu, Bakı, Azərbaycan</div>
          </div>
          <div class="row">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L13 13l5 2v3a2 2 0 0 1-2 2C9 20 2 13 2 6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <div><span class="k">Telefon</span>+994 12 345 67 89</div>
          </div>
          <div class="row">
            <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 5.5 10 11 18 5.5" stroke="currentColor" stroke-width="1.3"/></svg>
            <div><span class="k">E-poçt</span>info@eseryapi.az</div>
          </div>
          <div class="row">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 5.5V10l3 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <div><span class="k">İş saatları</span>B.e&ndash;Şənbə, 09:00&ndash;18:00 (GMT+4)</div>
          </div>
        </div>

        <div class="map-frame">
          <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=49.7871%2C40.3693%2C49.9471%2C40.4493&amp;layer=mapnik&amp;marker=40.4093%2C49.8671" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/main.js"></script>
</body>
</html>
