# ============================================================
# Eser Yapi MMC - Application Configuration
# ============================================================

spring.application.name=eser-yapi-website
server.port=8080

# ---- Database (H2, file-based so data survives restarts) ----
# The .mv.db file will be created in ./data next to where you run the app.
spring.datasource.url=jdbc:h2:file:./data/eseryapi;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Optional: browse the DB at http://localhost:8080/h2-console (dev only, disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Thymeleaf ----
# Set to true in production for performance; false makes template edits reload instantly.
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- File uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB
# Folder (relative to the working directory) where project/partner images are stored.
app.upload.dir=uploads

# ---- Admin account ----
# Change these before deploying to production!
app.admin.username=admin
app.admin.password=EserYapi2026!

# ---- Logging ----
logging.level.org.springframework.security=INFO
