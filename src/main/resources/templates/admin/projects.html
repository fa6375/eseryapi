<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layihələr — Admin — Eser Yapı MMC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div th:replace="~{fragments/admin-sidebar :: sidebar(active='projects')}"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Layihələr</h1>
        <p class="sub">Açıq Layihələr səhifənizdə göstərilən nümunə işləri idarə edin.</p>
      </div>
      <a href="/admin/projects/new" class="btn btn-primary">+ Yeni Layihə</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="panel">
      <table class="data-table" th:if="${projects != null and !projects.isEmpty()}">
        <thead>
          <tr><th></th><th>Başlıq</th><th>Kateqoriya</th><th>Məkan</th><th>Status</th><th>Fotolar</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="p : ${projects}">
            <td>
              <div class="row-thumb">
                <img th:if="${p.coverImage != null}" th:src="${p.coverImage.imagePath}" th:alt="${p.title}">
              </div>
            </td>
            <td><strong th:text="${p.title}">Başlıq</strong></td>
            <td th:text="${p.category ?: '—'}">Kateqoriya</td>
            <td th:text="${p.location ?: '—'}">Məkan</td>
            <td><span class="badge" th:text="${p.status.label}">Status</span></td>
            <td th:text="${p.images.size()}">0</td>
            <td>
              <div class="row-actions">
                <a th:href="@{'/projects/' + ${p.id}}" target="_blank" class="btn btn-outline btn-sm">Bax</a>
                <a th:href="@{'/admin/projects/' + ${p.id} + '/edit'}" class="btn btn-outline btn-sm">Redaktə Et</a>
                <form th:action="@{'/admin/projects/' + ${p.id} + '/delete'}" method="post" data-confirm="Bu layihəni və bütün fotolarını silmək istəyirsiniz? Bu geri qaytarıla bilməz.">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                  <button type="submit" class="btn btn-danger btn-sm">Sil</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="admin-empty" th:unless="${projects != null and !projects.isEmpty()}">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 17V8.5L10 4l7 4.5V17" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <p>Hələ layihə yoxdur. Açıq Layihələr səhifəsini doldurmaq üçün ilkini əlavə edin.</p>
        <a href="/admin/projects/new" class="btn btn-primary" style="margin-top:16px;">+ Yeni Layihə</a>
      </div>
    </div>
  </main>
</div>

</body>
</html>
