<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${isEdit} ? 'Tərəfdaşı Redaktə Et — Admin' : 'Yeni Tərəfdaş — Admin'">Tərəfdaş Formu — Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div th:replace="~{fragments/admin-sidebar :: sidebar(active='partners')}"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 th:text="${isEdit} ? 'Tərəfdaşı Redaktə Et' : 'Yeni Tərəfdaş'">Tərəfdaş Formu</h1>
      </div>
      <a href="/admin/partners" class="btn btn-outline">&larr; Tərəfdaşlara Qayıt</a>
    </div>

    <form th:action="@{/admin/partners/save}" th:object="${partner}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
      <input type="hidden" th:field="*{id}"/>

      <div class="panel">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="name">Tərəfdaş / təchizatçı adı</label>
            <input class="form-control" type="text" id="name" th:field="*{name}" required placeholder="məs. Reynaers Aluminium">
          </div>

          <div class="form-group span-2">
            <label for="websiteUrl">Veb sayt ünvanı (istəyə bağlı)</label>
            <input class="form-control" type="url" id="websiteUrl" th:field="*{websiteUrl}" placeholder="https://example.com">
          </div>

          <div class="form-group span-2" th:if="${isEdit and partner.logoPath != null}">
            <label>Cari Loqo</label>
            <div class="row-thumb" style="width:140px; height:80px; background:#fff; border:1px solid var(--line-on-light);">
              <img th:src="${partner.logoPath}" th:alt="${partner.name}" style="object-fit:contain;">
            </div>
          </div>

          <div class="form-group span-2">
            <label for="logo">Loqo şəkli <span th:unless="${isEdit}">(şəffaf fonlu PNG tövsiyə olunur)</span></label>
            <input class="form-control" type="file" id="logo" name="logo" accept="image/*" th:required="${!isEdit}">
          </div>
        </div>
      </div>

      <div style="display:flex; gap:14px;">
        <button type="submit" class="btn btn-primary">Tərəfdaşı Saxla</button>
        <a href="/admin/partners" class="btn btn-outline">Ləğv Et</a>
      </div>
    </form>
  </main>
</div>

</body>
</html>
