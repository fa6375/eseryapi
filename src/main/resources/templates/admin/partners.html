<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tərəfdaşlar — Admin — Eser Yapı MMC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div th:replace="~{fragments/admin-sidebar :: sidebar(active='partners')}"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Tərəfdaşlar</h1>
        <p class="sub">Tərəfdaşlar bölmənizdə göstərilən loqoları idarə edin.</p>
      </div>
      <a href="/admin/partners/new" class="btn btn-primary">+ Yeni Tərəfdaş</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="panel">
      <table class="data-table" th:if="${partners != null and !partners.isEmpty()}">
        <thead>
          <tr><th></th><th>Ad</th><th>Veb sayt</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="p : ${partners}">
            <td>
              <div class="row-thumb" style="background:#fff; border:1px solid var(--line-on-light);">
                <img th:if="${p.logoPath}" th:src="${p.logoPath}" th:alt="${p.name}" style="object-fit:contain;">
              </div>
            </td>
            <td><strong th:text="${p.name}">Ad</strong></td>
            <td th:text="${p.websiteUrl ?: '—'}">Veb sayt</td>
            <td>
              <div class="row-actions">
                <a th:href="@{'/admin/partners/' + ${p.id} + '/edit'}" class="btn btn-outline btn-sm">Redaktə Et</a>
                <form th:action="@{'/admin/partners/' + ${p.id} + '/delete'}" method="post" data-confirm="Bu tərəfdaşı silmək istəyirsiniz?">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                  <button type="submit" class="btn btn-danger btn-sm">Sil</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="admin-empty" th:unless="${partners != null and !partners.isEmpty()}">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M4 17a6 6 0 0 1 12 0" stroke="currentColor" stroke-width="1.4"/></svg>
        <p>Hələ tərəfdaş yoxdur. Açıq Tərəfdaşlar bölməsində göstərmək üçün loqo əlavə edin.</p>
        <a href="/admin/partners/new" class="btn btn-primary" style="margin-top:16px;">+ Yeni Tərəfdaş</a>
      </div>
    </div>
  </main>
</div>

</body>
</html>
