<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi — Eser Yapı MMC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="34" height="34">
        <rect x="1" y="1" width="38" height="38" rx="2" stroke="#5fc1d1" stroke-width="1.5"/>
        <line x1="14.3" y1="1" x2="14.3" y2="39" stroke="#5fc1d1" stroke-width="1.2"/>
        <line x1="27.6" y1="1" x2="27.6" y2="39" stroke="#5fc1d1" stroke-width="1.2"/>
        <line x1="1" y1="14.3" x2="39" y2="14.3" stroke="#5fc1d1" stroke-width="1.2"/>
        <line x1="1" y1="27.6" x2="39" y2="27.6" stroke="#5fc1d1" stroke-width="1.2"/>
        <rect x="14.3" y="14.3" width="13.3" height="13.3" fill="#e8a33d"/>
      </svg>
    </div>
    <h1>Admin Paneli</h1>
    <p class="sub">Layihələri, tərəfdaşları və mesajları idarə etmək üçün daxil olun.</p>

    <div th:if="${param.error}" class="alert alert-error">Yanlış istifadəçi adı və ya şifrə.</div>
    <div th:if="${param.logout}" class="alert alert-success">Sistemdən çıxdınız.</div>

    <form th:action="@{/admin/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
      <div class="form-group">
        <label for="username">İstifadəçi adı</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Şifrə</label>
        <input class="form-control" type="password" id="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Daxil Ol</button>
    </form>
  </div>
</div>

</body>
</html>
